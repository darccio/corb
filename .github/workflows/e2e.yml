# Manual/best-effort only: not part of ci.yml's required gate. GitHub-hosted
# runners don't reliably support the nested KVM virtualization Gondolin needs
# to boot a guest VM (see docs/design.md / the project plan's §8
# Verification), so the e2e suite can't be a required check here. Run it
# on-demand via workflow_dispatch, or locally with `make e2e`.
name: E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23.6.0"
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Run e2e suite
        run: make e2e
